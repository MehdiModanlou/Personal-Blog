<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Comment</title>
</head>
<body>

<h1>Edit Comment</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Update Comment
    </button>
</form>

<p>
    <a href="{% url 'blog:post_detail' object.post.pk %}">
        Cancel
    </a>
</p>

</body>
</html>
