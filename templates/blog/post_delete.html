<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post</title>
</head>
<body>

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete "{{ post.title }}"?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <p>
        <a href="{% url 'blog:post_detail' post.pk %}">
            Cancel
        </a>
    </p>

</body>
</html>
