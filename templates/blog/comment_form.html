<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Comment</title>
</head>
<body>

    <h1>Add Comment</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Comment
        </button>
    </form>

    <p>
        <a href="{% url 'blog:post_detail' view.kwargs.pk %}">
            Cancel
        </a>
    </p>

</body>
</html>
