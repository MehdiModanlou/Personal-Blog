<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Comment</title>
</head>
<body>

    <h1>Delete Comment</h1>

    <p>
        Are you sure you want to delete this comment?
    </p>

    <p>
        "{{ object.body }}"
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <p>
        <a href="{% url 'blog:post_detail' object.post.pk %}">
            Cancel
        </a>
    </p>

</body>
</html>
